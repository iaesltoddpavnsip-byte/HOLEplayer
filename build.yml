name: Build EXE + APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build:exe
      - uses: actions/upload-artifact@v4
        with: { name: BlackHolePlayer-exe, path: dist/BlackHolePlayer.exe }
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run prep:www
      - run: npx cap add android
      - name: Установить иконку
        run: |
          RES=android/app/src/main/res
          find $RES -path '*/mipmap-*dpi/*' -name 'ic_launcher*' -delete
          cp -r android-icons/* $RES/
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: { name: BlackHolePlayer-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
