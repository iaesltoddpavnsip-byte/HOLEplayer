<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>BlackHole Player</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #000; color: #fff; }

/* ═══ BLACK HOLE BG ═══ */
#bhCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* ═══ LAYOUT ═══ */
.shell {
  position: fixed;
  inset: 0;
  z-index: 1;
  display: grid;
  grid-template-rows: 1fr 90px;
}

.main {
  display: grid;
  grid-template-columns: 210px 1fr;
  overflow: hidden;
}

/* ═══ GLASS MIXIN ═══ */
.glass {
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border: 0.5px solid rgba(255,255,255,0.08);
}

/* ═══ SIDEBAR ═══ */
.sidebar {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-right: 0.5px solid rgba(255,255,255,0.06);
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
}

.sidebar-top {
  padding: 16px 12px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sidebar-title {
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,0.4);
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 0 4px;
}

.sidebar-add {
  background: rgba(255,255,255,0.07);
  border: 0.5px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.5);
  cursor: pointer;
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.sidebar-add:hover { color: #fff; background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); }

.sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px 16px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.08) transparent;
}
.sidebar-scroll::-webkit-scrollbar { width: 3px; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

.playlist-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.12s;
}
.playlist-item:hover { background: rgba(255,255,255,0.06); }
.playlist-item.active { background: rgba(255,255,255,0.1); }

.pl-thumb {
  width: 36px; height: 36px;
  border-radius: 6px;
  background: rgba(255,255,255,0.07);
  border: 0.5px solid rgba(255,255,255,0.1);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}

.pl-info { min-width: 0; }
.pl-name { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-meta { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 1px; }

/* ═══ CONTENT ═══ */
.content {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* Header */
.content-header {
  flex-shrink: 0;
  padding: 32px 28px 20px;
  background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 100%);
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 14px;
}

/* Glass button big */
.btn-play-big {
  width: 50px; height: 50px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  border: 0.5px solid rgba(255,255,255,0.3);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  transition: all 0.15s;
  flex-shrink: 0;
}
.btn-play-big:hover { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.5); transform: scale(1.05); }
.btn-play-big:active { transform: scale(0.96); }

.btn-header {
  background: rgba(255,255,255,0.07);
  border: 0.5px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  cursor: pointer;
  color: rgba(255,255,255,0.55);
  display: flex; align-items: center; justify-content: center;
  padding: 8px;
  border-radius: 50%;
  transition: all 0.15s;
}
.btn-header:hover { color: #fff; background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.2); }
.btn-header.active { color: #e8a060; border-color: rgba(232,160,96,0.4); background: rgba(232,160,96,0.1); }

/* Chips */
.chips {
  display: flex;
  gap: 8px;
  padding: 0 28px 16px;
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }

.chip {
  padding: 5px 14px;
  border-radius: 20px;
  border: 0.5px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: rgba(255,255,255,0.6);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
  font-family: 'Inter', sans-serif;
}
.chip:hover { background: rgba(255,255,255,0.12); color: #fff; }
.chip.active { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.3); }

/* Track table */
.track-table-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px 16px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.06) transparent;
}
.track-table-wrap::-webkit-scrollbar { width: 3px; }
.track-table-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }

.table-head {
  display: grid;
  grid-template-columns: 36px 40px 1fr 140px 70px 34px;
  padding: 6px 12px;
  border-bottom: 0.5px solid rgba(255,255,255,0.06);
  margin-bottom: 4px;
  position: sticky; top: 0;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 2;
  border-radius: 6px 6px 0 0;
}

.th {
  font-size: 10px;
  font-weight: 600;
  color: rgba(255,255,255,0.3);
  letter-spacing: 0.8px;
  text-transform: uppercase;
}

.track-row {
  display: grid;
  grid-template-columns: 36px 40px 1fr 140px 70px 34px;
  padding: 7px 12px;
  border-radius: 8px;
  cursor: pointer;
  align-items: center;
  transition: background 0.12s;
  margin-bottom: 2px;
}
.track-row:hover { background: rgba(255,255,255,0.06); }
.track-row.playing { background: rgba(232,160,96,0.08); border: 0.5px solid rgba(232,160,96,0.15); }

.track-row:hover .tr-num-val { display: none; }
.track-row:hover .tr-play-icon { display: flex !important; }
.track-row.playing .tr-num-val { display: none; }
.track-row.playing .tr-play-icon { display: flex !important; }

.tr-num { text-align: center; }
.tr-num-val { font-size: 13px; color: rgba(255,255,255,0.35); }
.tr-play-icon { display: none; align-items: center; justify-content: center; color: rgba(255,255,255,0.8); }
.track-row.playing .tr-num-val-play { color: #e8a060; }

.tr-thumb {
  width: 34px; height: 34px;
  border-radius: 5px;
  background: rgba(255,255,255,0.06);
  border: 0.5px solid rgba(255,255,255,0.08);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
}

.tr-info { min-width: 0; padding: 0 10px; }
.tr-name {
  font-size: 13px; font-weight: 500;
  color: rgba(255,255,255,0.9);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.track-row.playing .tr-name { color: #e8a060; }
.tr-artist { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 2px; }

.tr-album { font-size: 12px; color: rgba(255,255,255,0.3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
.tr-dur { font-size: 12px; color: rgba(255,255,255,0.3); text-align: right; }
.tr-del {
  background: none; border: none; cursor: pointer;
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.35); opacity: 0;
  transition: opacity 0.12s, background 0.12s, color 0.12s;
}
.track-row:hover .tr-del, .track-row.playing .tr-del { opacity: 1; }
.tr-del:hover { background: rgba(255,80,80,0.15); color: #ff6b6b; }
@media (hover: none) { .tr-del { opacity: 0.8; } }

/* Empty state */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 14px;
  padding: 60px 24px; color: rgba(255,255,255,0.25); text-align: center;
}
.empty-state svg { opacity: 0.2; }
.empty-state p { font-size: 13px; line-height: 1.7; color: rgba(255,255,255,0.35); }

.empty-add {
  font-size: 13px; color: #fff;
  background: rgba(255,255,255,0.1);
  border: 0.5px solid rgba(255,255,255,0.2);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 10px 24px; border-radius: 20px;
  cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 500;
  transition: all 0.15s;
}
.empty-add:hover { background: rgba(255,255,255,0.18); }

/* ═══ BOTTOM PLAYER ═══ */
.player-bar {
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(24px) saturate(1.5);
  -webkit-backdrop-filter: blur(24px) saturate(1.5);
  border-top: 0.5px solid rgba(255,255,255,0.07);
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  height: 90px;
}

.pb-left {
  display: flex; align-items: center; gap: 12px; min-width: 0;
}

.pb-thumb {
  width: 50px; height: 50px;
  border-radius: 8px;
  background: rgba(255,255,255,0.06);
  border: 0.5px solid rgba(255,255,255,0.1);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}

.pb-track-info { min-width: 0; }
.pb-name { font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb-artist { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 2px; }

.pb-fav {
  background: none; border: none; cursor: pointer;
  color: rgba(255,255,255,0.3); padding: 4px; flex-shrink: 0;
  transition: color 0.15s;
}
.pb-fav:hover { color: rgba(255,255,255,0.7); }
.pb-fav.active { color: #e8a060; }

/* Center controls */
.pb-center { display: flex; flex-direction: column; align-items: center; gap: 8px; }

.pb-btns { display: flex; align-items: center; gap: 14px; }

.pb-btn {
  background: none; border: none; cursor: pointer;
  color: rgba(255,255,255,0.4);
  display: flex; align-items: center; justify-content: center;
  padding: 5px; border-radius: 50%;
  transition: color 0.15s, transform 0.12s;
}
.pb-btn:hover { color: rgba(255,255,255,0.9); transform: scale(1.1); }
.pb-btn:active { transform: scale(0.93); }
.pb-btn.active { color: #e8a060; }

.pb-btn-play {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  border: 0.5px solid rgba(255,255,255,0.25);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  transition: all 0.15s;
  flex-shrink: 0;
}
.pb-btn-play:hover { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.4); transform: scale(1.06); }
.pb-btn-play:active { transform: scale(0.95); }

.pb-progress { display: flex; align-items: center; gap: 10px; width: 100%; }
.pb-time { font-size: 10px; color: rgba(255,255,255,0.3); flex-shrink: 0; min-width: 32px; }
.pb-time.right { text-align: right; }

.progress-track-bar {
  flex: 1; height: 3px;
  background: rgba(255,255,255,0.12);
  border-radius: 99px; cursor: pointer; position: relative;
}
.progress-track-bar:hover .prog-fill { background: #e8a060; }
.progress-track-bar:hover .prog-thumb { opacity: 1; }

.prog-fill {
  height: 100%; background: rgba(255,255,255,0.7);
  border-radius: 99px; width: 0%;
  pointer-events: none;
  transition: width 0.1s linear, background 0.2s;
  position: relative;
}

.prog-thumb {
  position: absolute; right: -5px; top: 50%;
  transform: translateY(-50%);
  width: 12px; height: 12px; border-radius: 50%;
  background: #fff; opacity: 0; transition: opacity 0.15s;
  pointer-events: none;
}

/* Right */
.pb-right { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }

input[type=range].vol-bar {
  -webkit-appearance: none; width: 80px; height: 3px;
  background: rgba(255,255,255,0.15); border-radius: 99px;
  outline: none; cursor: pointer;
}
input[type=range].vol-bar::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px;
  border-radius: 50%; background: rgba(255,255,255,0.8); cursor: pointer;
}

/* ─── VIS MODAL ─── */
.vis-modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: none; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
}
.vis-modal.open { display: flex; }

.vis-modal-card {
  background: rgba(10,5,15,0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 0.5px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
  width: 90vw; max-width: 680px;
}

#visCanvas { width: 100%; height: 300px; display: block; border-radius: 8px; }

.vis-modal-controls { display: flex; gap: 8px; }
.vis-modal-btn {
  flex: 1; padding: 7px 4px;
  background: rgba(255,255,255,0.06);
  border: 0.5px solid rgba(255,255,255,0.1);
  border-radius: 20px; color: rgba(255,255,255,0.5);
  font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; letter-spacing: 0.3px;
}
.vis-modal-btn:hover { color: #fff; border-color: rgba(255,255,255,0.2); }
.vis-modal-btn.active { background: rgba(232,160,96,0.15); color: #e8a060; border-color: rgba(232,160,96,0.3); }

.vis-modal-close {
  position: absolute; top: 20px; right: 24px;
  background: rgba(255,255,255,0.08);
  border: 0.5px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.5); font-size: 16px;
  cursor: pointer; padding: 6px 10px; border-radius: 20px;
  transition: all 0.15s; font-family: 'Inter', sans-serif;
}
.vis-modal-close:hover { color: #fff; background: rgba(255,255,255,0.14); }

#fileInput { display: none; }

/* ─── MOBILE OPTIMIZATIONS ─── */
@media (max-width: 640px) {
  .main { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .table-head, .track-row { grid-template-columns: 32px 36px 1fr 60px 34px; }
  .tr-album { display: none; }
  .content-header { padding: 20px 16px 12px; }
  .chips { padding: 0 16px 10px; }
  .track-table-wrap { padding: 0 8px 12px; }
  .player-bar { padding: 0 14px; gap: 10px; grid-template-columns: 1fr; grid-template-rows: auto auto; }
  .pb-left { order: 2; justify-content: center; }
  .pb-center { order: 1; }
  .pb-right { display: none; }
  input[type=range].vol-bar { width: 55px; }
  
  /* Увеличенные кнопки для пальцев */
  .btn-play-big { width: 58px; height: 58px; }
  .btn-header { padding: 10px; }
  .pb-btn-play { width: 44px; height: 44px; }
  .track-row { padding: 10px 12px; }
  
  /* Уменьшаем нагрузку на чёрную дыру */
  #bhCanvas { opacity: 0.6; }
}

@media (max-width: 480px) {
  .shell { grid-template-rows: 1fr 110px; }
  .player-bar { height: 110px; padding: 8px 12px; }
  .pb-progress { width: 100%; }
  .pb-fav { display: none; }
  .vis-modal-card { width: 95vw; padding: 12px; }
  #visCanvas { height: 220px; }
}
</style>
</head>
<body>

<!-- Black hole canvas -->
<canvas id="bhCanvas"></canvas>

<!-- Vis modal -->
<div class="vis-modal" id="visModal">
  <button class="vis-modal-close" id="btnCloseVis">✕ закрыть</button>
  <div class="vis-modal-card">
    <canvas id="visCanvas"></canvas>
    <div class="vis-modal-controls">
      <button class="vis-modal-btn active" data-mode="bars">BARS</button>
      <button class="vis-modal-btn" data-mode="wave">WAVE</button>
      <button class="vis-modal-btn" data-mode="circle">CIRCLE</button>
      <button class="vis-modal-btn" data-mode="particles">PARTICLES</button>
    </div>
  </div>
</div>

<div class="shell">
  <div class="main">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-top">
        <span class="sidebar-title">Медиатека</span>
        <label class="sidebar-add" for="fileInput" title="Добавить треки">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </label>
      </div>
      <div class="sidebar-scroll">
        <div class="playlist-item active">
          <div class="pl-thumb">🌌</div>
          <div class="pl-info">
            <div class="pl-name">Мои треки</div>
            <div class="pl-meta">Плейлист</div>
          </div>
        </div>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="content">
      <div class="content-header">
        <div class="header-controls">
          <button class="btn-play-big" id="btnPlayAll" aria-label="Воспроизвести">
            <svg id="iconPlayAll" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <svg id="iconPauseAll" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
          </button>
          <button class="btn-header" id="btnShuffle" aria-label="Перемешать">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
              <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>
            </svg>
          </button>
          <button class="btn-header" id="btnOpenVis" aria-label="Визуализация">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="14" width="4" height="7"/><rect x="9" y="9" width="4" height="12"/><rect x="16" y="3" width="4" height="18"/>
            </svg>
          </button>
          <label class="btn-header" for="fileInput" style="cursor:pointer" title="Загрузить треки">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </label>
        </div>
      </div>

      <div class="chips">
        <button class="chip active">Все треки</button>
        <button class="chip">Недавние</button>
      </div>

      <div class="track-table-wrap">
        <div class="table-head">
          <div class="th">#</div>
          <div class="th"></div>
          <div class="th">Название</div>
          <div class="th">Альбом</div>
          <div class="th" style="text-align:right">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div class="th"></div>
        </div>

        <div class="empty-state" id="emptyState">

<script>
// ═══════════════════════════════
// BLACK HOLE CANVAS
// ═══════════════════════════════
let bhCanvas = document.getElementById('bhCanvas');
let audioEnergy = 0, audioBass = 0;
let bhSuspended = false;   // окно свёрнуто / вкладка скрыта — анимация стоит
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;

// ─── Fragment shader: геодезические Шварцшильда + аккреционный диск ───
const BH_FRAG = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2  uRes;
uniform float uTime;
uniform float uEnergy;
uniform float uBass;
uniform vec2  uCenter;
uniform float uSteps;
uniform float uSing;    // сила «сингулярности» в центре тени
uniform vec2  uMWPos;    // центр Млечного Пути на экране (пиксели рендера)
uniform vec2  uMWDir;    // направление полосы на экране
uniform vec2  uMWSize;   // длина и ширина (пиксели рендера)

#define MAX_STEPS 180
#define R_IN   2.05
#define R_OUT  9.6
#define FS     1.28

float gPx;
vec3 mwC, mwU, mwV;         // центр и оси далёкого участка Млечного Пути
vec2 mwSz;                  // его размеры в «единицах неба»

float hash13(vec3 p){
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}
float hash12(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

float vnoise(vec3 p){
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(mix(hash13(i), hash13(i + vec3(1.,0.,0.)), f.x),
        mix(hash13(i + vec3(0.,1.,0.)), hash13(i + vec3(1.,1.,0.)), f.x), f.y),
    mix(mix(hash13(i + vec3(0.,0.,1.)), hash13(i + vec3(1.,0.,1.)), f.x),
        mix(hash13(i + vec3(0.,1.,1.)), hash13(i + vec3(1.,1.,1.)), f.x), f.y), f.z);
}

// ═══════════ Гаргантюа: палитра — тёмно-красный → янтарь → бледное золото → белый ═══════════
vec3 bb(float k){
  vec3 c1 = vec3(0.30, 0.05, 0.010);
  vec3 c2 = vec3(0.95, 0.32, 0.050);
  vec3 c3 = vec3(1.00, 0.63, 0.220);
  vec3 c4 = vec3(1.00, 0.87, 0.620);
  vec3 c5 = vec3(1.00, 0.97, 0.900);
  vec3 c = mix(c1, c2, smoothstep(0.08, 0.40, k));
  c = mix(c, c3, smoothstep(0.35, 0.70, k));
  c = mix(c, c4, smoothstep(0.65, 1.05, k));
  c = mix(c, c5, smoothstep(1.00, 1.50, k));
  return c;
}

float fbmDisk(float a, float r){
  vec3 q = vec3(cos(a) * 4.0, sin(a) * 4.0, r * 5.0);
  float v = 0.0, amp = 0.5;
  for (int i = 0; i < 3; i++){
    v += amp * vnoise(q);
    q = q * 2.03 + vec3(1.7, 9.2, 3.1);
    amp *= 0.5;
  }
  return v / 0.875;
}

// дифференциальное вращение без бесконечного скручивания (flow-map)
float diskNoise(vec2 xz, float r, float time){
  float T = 16.0;
  float p1 = fract(time / T), p2 = fract(time / T + 0.5);
  float w = abs(2.0 * p1 - 1.0);
  float om = 3.0 * pow(r, -1.5);
  float a = atan(xz.y, xz.x);
  return mix(fbmDisk(a - om * p1 * T, r), fbmDisk(a - om * p2 * T, r), w);
}

float gain(){ return 2.0 * (1.0 + uEnergy * 1.3 + uBass * 0.7); }

vec4 diskSample(vec3 hit, vec3 rd){
  float r = length(hit.xz);
  float edge = smoothstep(R_IN, R_IN + 0.10, r) * (1.0 - smoothstep(R_OUT - 3.4, R_OUT, r));
  if (edge < 0.002) return vec4(0.0);

  float n = diskNoise(hit.xz, r, uTime);
  float temp = pow(R_IN / r, 0.62);

  // эффект Доплера приглушён (как в фильме) + гравитационное красное смещение
  float v = min(0.6, sqrt(0.5 / max(r - 0.9, 0.2)));
  vec3 vdir = normalize(vec3(-hit.z, 0.0, hit.x));
  float g = sqrt(1.0 - v * v) / (1.0 - v * dot(vdir, -rd));
  g *= sqrt(max(1.0 - 1.0 / r, 0.02));
  float gk = mix(1.0, g, 0.40);

  float k = min(temp * gk, 1.35);
  float I = pow(temp, 2.3) * mix(1.0, pow(max(g, 0.0), 2.6), 0.45);
  float fine = 0.90 + 0.10 * sin(r * 60.0 + n * 6.0);

  vec3 emit = bb(k) * I * (0.40 + 1.05 * n) * fine * gain();
  float alpha = edge * clamp(0.55 + n * 0.9, 0.0, 0.97);
  return vec4(emit, alpha);
}

// ═══════════ звёзды и Млечный Путь ═══════════
vec3 starLayer(vec3 d, float scale, float thr){
  vec3 p = d * scale;
  vec3 c = floor(p);
  vec3 f = p - c;
  float h = hash13(c);
  if (h < thr) return vec3(0.0);
  vec3 o = vec3(hash13(c + 7.1), hash13(c + 13.7), hash13(c + 3.3));
  float dist = length(f - o);
  float size = min(max(0.09 + 0.13 * hash13(c + 41.0), gPx * scale), 0.7);
  float b = smoothstep(size, 0.0, dist);
  float tw = 0.78 + 0.22 * sin(uTime * (1.0 + 3.0 * h) + h * 50.0);
  vec3 tint = mix(vec3(0.72, 0.82, 1.0), vec3(1.0, 0.86, 0.66), hash13(c + 99.0));
  return tint * b * tw * (0.5 + 1.7 * hash13(c + 5.5));
}

// Млечный Путь: далёкий участок полосы в углу экрана — тёплое ядро, синеватые края,
// тёмный пылевой разлом вдоль оси, облачная структура и россыпь неразрешённых звёзд
float fbm3(vec3 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++){
    v += a * vnoise(p);
    p = p * 2.03 + vec3(5.2, 1.3, 8.7);
    a *= 0.5;
  }
  return v / 0.9375;
}

vec3 milkyway(vec3 d, out float bw){
  bw = 0.0;
  float dc = dot(d, mwC);
  if (dc < 0.55) return vec3(0.0);
  vec2 q = vec2(dot(d, mwU), dot(d, mwV)) / dc;
  float x = q.x / mwSz.x;                                   // вдоль полосы
  float yq = q.y / mwSz.y;                                  // поперёк полосы
  if (abs(x) > 3.2 || abs(yq) > 4.0) return vec3(0.0);
  float along = exp(-x * x * 0.5);                          // к концам полоса растворяется
  float bulge = exp(-x * x * 1.2);                          // яркая середина
  float y = yq + 0.35 * sin(x * 1.6 + 1.1);                 // полоса слегка извивается
  float core = exp(-y * y * 1.4);
  float halo = exp(-y * y * 0.80);
  bw = clamp((core + 0.5 * halo) * along, 0.0, 1.0);

  vec2 nq = vec2(x, yq);
  float n1 = fbm3(vec3(nq * 0.8, 3.0));
  float n2 = fbm3(vec3(nq * 2.2, 11.0));

  float rx = (y - 0.15 * sin(x * 2.5 + n1 * 3.0)) / (0.22 + 0.2 * bulge);
  float rift = exp(-rx * rx) * smoothstep(0.35, 0.65, n1);  // пылевой разлом
  float dust = clamp(rift + smoothstep(0.55, 0.80, n2) * core * 0.5, 0.0, 0.9);

  float base = (core + 0.5 * halo) * along * (0.42 + 0.9 * bulge) * (0.65 + 0.7 * n2);
  float warm = clamp(0.2 + bulge * 0.9 + core * 0.25, 0.0, 1.0);
  vec3 col = mix(vec3(0.50, 0.60, 0.95), vec3(1.0, 0.80, 0.56), warm);
  vec3 L = col * base * 0.20 * (1.0 - dust);
  L *= 0.8 + 0.5 * vnoise(d * 140.0);                       // мелкое зерно звёздной пыли
  float neb = smoothstep(0.62, 0.85, n1 * n2 * 1.6) * bulge * core;
  L += vec3(1.0, 0.45, 0.55) * neb * 0.05;                  // розоватые эмиссионные области
  return L;
}

vec3 background(vec3 d){
  float bw;
  vec3 col = milkyway(d, bw);
  float k = 1.0 - bw;                                       // в полосе звёзд заметно больше
  col += 0.75 * starLayer(d, 90.0,  0.935 + 0.030 * k)
       + 0.60 * starLayer(d, 230.0, 0.940 + 0.045 * k)
       + 0.50 * starLayer(d, 420.0, 0.940 + 0.045 * k)
       + 0.40 * starLayer(d, 650.0, 0.935 + 0.040 * k);
  return col;
}

vec3 aces(vec3 x){
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

void main(){
  vec2 frag = gl_FragCoord.xy;
  float m = min(uRes.x, uRes.y);
  gPx = FS / m;

  vec2 p = (frag - uRes * uCenter) / m;
  float roll = -0.045;
  float cr = cos(roll), sr = sin(roll);
  p = mat2(cr, sr, -sr, cr) * p;

  float elev = 0.085 + 0.018 * sin(uTime * 0.11);
  float dist = 17.0 - uBass * 0.7;
  float yaw = 0.05 * sin(uTime * 0.07);
  vec3 ro = dist * vec3(sin(yaw) * cos(elev), sin(elev), -cos(yaw) * cos(elev));
  vec3 fw = normalize(-ro);
  vec3 rt = normalize(cross(vec3(0.0, 1.0, 0.0), fw));
  vec3 up = cross(fw, rt);
  vec3 rd = normalize(fw + (p.x * rt + p.y * up) * FS);

  // Млечный Путь в углу экрана: место в небе фиксировано (камера без покачивания),
  // поправка на линзирование — чтобы на экране он оказался там, где задано
  float e0 = 0.085, d0 = 17.0;
  vec3 fw0 = normalize(-d0 * vec3(0.0, sin(e0), -cos(e0)));
  vec3 rt0 = normalize(cross(vec3(0.0, 1.0, 0.0), fw0));
  vec3 up0 = cross(fw0, rt0);
  mat2 rollM = mat2(cr, sr, -sr, cr);
  vec2 q0 = rollM * ((uMWPos - uRes * uCenter) / m) * FS;
  float th0 = max(length(q0), 0.05);
  float tt = atan(th0);                                      // угол от дыры до точки на экране
  float bi = d0 * sin(tt);                                   // прицельный параметр
  float beta = max(tt - (2.0 / bi + 2.945 / (bi * bi)), 0.03);  // откуда на самом деле идёт луч
  q0 *= tan(beta) / th0;
  mwC = normalize(fw0 + q0.x * rt0 + q0.y * up0);
  vec2 t2 = rollM * uMWDir;
  vec3 tw = t2.x * rt0 + t2.y * up0;
  mwU = normalize(tw - mwC * dot(tw, mwC));
  mwV = cross(mwC, mwU);
  mwSz = uMWSize * FS / m;

  vec3 pos = ro, vel = rd;
  vec3 hv = cross(pos, vel);
  float h2 = dot(hv, hv);

  vec3 col = vec3(0.0);
  float trans = 1.0;
  float glow = 0.0;
  bool captured = false;

  for (int i = 0; i < MAX_STEPS; i++){
    if (float(i) >= uSteps) break;
    float r2 = dot(pos, pos);
    float r = sqrt(r2);
    if (r < 1.0){ captured = true; break; }
    if (r > 45.0 && dot(pos, vel) > 0.0) break;

    float dt = clamp(0.07 * (r - 0.8), 0.02, 1.0);
    dt = min(dt, 0.08 + 0.35 * abs(pos.y));

    vec3 acc = -1.5 * h2 * pos / (r2 * r2 * r);
    vec3 nv = normalize(vel + acc * dt);
    vec3 np = pos + nv * dt;

    // тонкая дымка и мягкое свечение (bloom) вокруг диска
    float hr = length(pos.xz);
    float inDisk = smoothstep(R_IN - 0.3, R_IN + 0.5, hr) * (1.0 - smoothstep(R_OUT - 4.0, R_OUT + 1.0, hr));
    if (inDisk > 0.002 && abs(pos.y) < 3.0){
      float th = 0.06 + 0.035 * hr;
      float dens = exp(-(pos.y * pos.y) / (th * th));
      float wide = exp(-(pos.y * pos.y) / (0.8 + 0.03 * hr * hr));
      float hk = pow(R_IN / max(hr, R_IN), 0.62);
      col += trans * bb(hk * 0.95) * inDisk * (dens * 0.11 + wide * 0.010) * dt * pow(hk, 1.6) * gain();
    }

    // тонкое яркое фотонное кольцо
    float gr = (r - 1.52) * 11.0;
    glow += exp(-gr * gr) * dt;

    // пересечение плоскости диска
    if (pos.y * np.y < 0.0){
      float f = pos.y / (pos.y - np.y);
      vec3 hit = mix(pos, np, f);
      vec4 dk = diskSample(hit, nv);
      col += trans * dk.rgb * dk.a;
      trans *= (1.0 - dk.a);
      if (trans < 0.02) break;
    }
    pos = np; vel = nv;
  }

  if (!captured){
    col += trans * background(vel);
    col += vec3(1.0, 0.84, 0.58) * glow * 0.16 * (1.0 + uEnergy) * trans;
  } else if (uSing > 0.0){
    // «сингулярность»: раскалённая точка в центре тени и слабая закрученная дымка вокруг неё
    float sh = length(p) / 0.121;                                    // 1.0 = край тени
    float pulse = 0.78 + 0.22 * sin(uTime * 1.7) + uBass * 0.5;
    float core = exp(-sh * sh * 70.0);
    float haze = exp(-sh * sh * 7.0);
    float sw = 0.5 + 0.5 * sin(atan(p.y, p.x) * 3.0 - uTime * 2.0 + sh * 14.0);
    vec3 hot = mix(vec3(1.0, 0.42, 0.10), vec3(1.0, 0.92, 0.75), core);
    col += hot * (core * 1.1 + haze * (0.04 + 0.07 * sw)) * pulse * uSing;
  }

  col = aces(col * 0.95);
  col = pow(col, vec3(0.95));
  col += (hash12(frag + fract(uTime)) - 0.5) / 160.0;
  gl_FragColor = vec4(col, 1.0);
}
`;

const BH_VERT = `attribute vec2 aPos; void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;

let bhTriedGL = false;

// ═══ РЕЖИМ ЧЁРНОЙ ДЫРЫ ═══
// 0  = статичная картинка: шейдер считается ОДИН раз в полном качестве, потом ноль нагрузки
// >0 = живая анимация с этим числом кадров в секунду (например 12, 20, 30) — нагрузка растёт с fps
const BH_LIVE_FPS = 30;
const BH_MW = { corner: 'tr', dist: 150, angle: 45, length: 95, width: 30 };
// Млечный Путь: угол экрана ('tr' верх-право, 'br' низ-право, 'tl', 'bl'), расстояние от угла в px по диагонали,
// угол диагонали в градусах, длина и ширина полосы в px
const BH_SINGULARITY = 0.8;   // раскалённая точка в центре тени: 0 — выкл, 1 — ярче
const BH_SCALE = 1.0;      // разрешение рендера: 1.0 = пиксель в пиксель, 0.75 — легче, 1.25 — чётче

function startBlackHoleGL() {
  bhTriedGL = true;
  const gl = bhCanvas.getContext('webgl', {
    alpha: false, antialias: false, depth: false, stencil: false,
    powerPreference: 'default'
  });
  if (!gl) return false;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.warn('BH shader error:', gl.getShaderInfoLog(sh));
      return null;
    }
    return sh;
  }
  const vs = compile(gl.VERTEX_SHADER, BH_VERT);
  const fs = compile(gl.FRAGMENT_SHADER, BH_FRAG);
  if (!vs || !fs) return false;
  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.warn(gl.getProgramInfoLog(prog)); return false; }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  ['uRes','uTime','uEnergy','uBass','uCenter','uSteps','uSing','uMWPos','uMWDir','uMWSize'].forEach(n => U[n] = gl.getUniformLocation(prog, n));

  // адаптивное разрешение: держим плавные 60 fps
  const dpr = window.devicePixelRatio || 1;
  const live = BH_LIVE_FPS > 0;
  const maxScale = isMobile ? 0.7 : Math.min(dpr, BH_SCALE);
  const minScale = 0.5;
  let scale = maxScale;
  let steps = isMobile ? 110 : 150;
  const FRAME_PLAY = 1000 / (BH_LIVE_FPS || 30);
  const FRAME_IDLE = 1000 / Math.min(BH_LIVE_FPS || 30, 20);   // на паузе чуть реже
  let lastDraw = 0;
  let rafId = 0, simTime = 0, last = 0, ema = 16.7, frames = 0, goodWindows = 0, lost = false;

  function resize() {
    const w = Math.max(2, Math.floor(window.innerWidth * scale));
    const h = Math.max(2, Math.floor(window.innerHeight * scale));
    if (bhCanvas.width !== w || bhCanvas.height !== h) {
      bhCanvas.width = w; bhCanvas.height = h;
      gl.viewport(0, 0, w, h);
      if (!live) requestAnimationFrame(drawStatic);   // изменение размера стирает холст — перерисуем
    }
  }

  // положение Млечного Пути на экране считаем в пикселях окна, чтобы «150 px от угла» было честным
  function setMW() {
    const k = bhCanvas.width / window.innerWidth;           // пикселей рендера на пиксель окна
    const sx = BH_MW.corner.includes('r') ? 1 : -1;
    const sy = BH_MW.corner.includes('t') ? 1 : -1;
    const a = BH_MW.angle * Math.PI / 180;
    const ix = -sx * Math.cos(a), iy = -sy * Math.sin(a);   // от угла внутрь экрана
    gl.uniform2f(U.uMWPos, (sx > 0 ? bhCanvas.width : 0) + ix * BH_MW.dist * k,
                           (sy > 0 ? bhCanvas.height : 0) + iy * BH_MW.dist * k);
    gl.uniform2f(U.uMWDir, -iy, ix);                         // полоса поперёк диагонали
    gl.uniform2f(U.uMWSize, BH_MW.length * k, BH_MW.width * k);
  }

  // статичный кадр: одна отрисовка, дальше GPU/CPU не нагружаются
  function drawStatic() {
    gl.uniform2f(U.uRes, bhCanvas.width, bhCanvas.height);
    setMW();
    gl.uniform1f(U.uSing, BH_SINGULARITY);
    gl.uniform1f(U.uTime, 6.0);
    gl.uniform1f(U.uEnergy, 0.0);
    gl.uniform1f(U.uBass, 0.0);
    gl.uniform2f(U.uCenter, 0.62, 0.58);
    gl.uniform1f(U.uSteps, steps);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  window.addEventListener('resize', resize);
  bhCanvas.addEventListener('webglcontextlost', e => { e.preventDefault(); lost = true; });
  bhCanvas.addEventListener('webglcontextrestored', () => { location.reload(); });
  resize();

  function frame(ts) {
    rafId = requestAnimationFrame(frame);
    if (lost || bhSuspended || document.hidden) return;
    const visOpen = document.getElementById('visModal').classList.contains('open');
    if (visOpen) { last = 0; return; }                       // дыру всё равно закрывает модалка
    const target = audio.paused ? FRAME_IDLE : FRAME_PLAY;
    if (ts - lastDraw < target - 2) return;                  // пропускаем кадр: ничего не рисуем, GPU отдыхает
    lastDraw = ts;
    const dtMs = last ? Math.min(ts - last, 100) : 33;
    last = ts;
    simTime += (dtMs / 1000) * (1.0 + audioEnergy * 1.6);

    // подстройка качества
    ema += (dtMs - ema) * 0.1;
    if (++frames % 45 === 0) {
      if (ema > target * 1.25) {
        goodWindows = 0;
        if (scale > minScale) scale = Math.max(minScale, scale * 0.85);
        else if (steps > 80) steps -= 15;
        resize();
      }
    }

    const e = Math.min(audioEnergy * 3.2, 1.5);
    const bs = Math.min(Math.max((audioBass - 0.25) / 0.6, 0), 1);
    gl.uniform2f(U.uRes, bhCanvas.width, bhCanvas.height);
    setMW();
    gl.uniform1f(U.uSing, BH_SINGULARITY);
    gl.uniform1f(U.uTime, simTime);
    gl.uniform1f(U.uEnergy, e);
    gl.uniform1f(U.uBass, bs);
    gl.uniform2f(U.uCenter, 0.62, 0.58);
    gl.uniform1f(U.uSteps, steps);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  if (live) rafId = requestAnimationFrame(frame);
  else drawStatic();

  // свернули окно / переключили вкладку — цикл отрисовки останавливается полностью
  const suspend = () => { bhSuspended = true; cancelAnimationFrame(rafId); rafId = 0; };
  const wake = () => {
    bhSuspended = document.hidden;
    if (!bhSuspended && live && !rafId && !lost) { last = 0; rafId = requestAnimationFrame(frame); }
  };
  document.addEventListener('visibilitychange', () => (document.hidden ? suspend() : wake()));
  window.addEventListener('bh-pause', suspend);     // шлёт main.js при сворачивании окна
  window.addEventListener('bh-resume', wake);
  return true;
}

// ─── Запасной вариант: старая 2D-версия (если WebGL недоступен) ───
function startBlackHole2D() {
  if (bhTriedGL) {
    const c = bhCanvas.cloneNode(false);
    bhCanvas.parentNode.replaceChild(c, bhCanvas);
    bhCanvas = c;
  }
  const bhCanvasLocal = bhCanvas;
const bc = bhCanvasLocal.getContext('2d');
let W, H, t = 0;
const qualityMultiplier = isMobile ? 0.5 : 1; // Снижаем качество на мобильных

function resizeBH() {
  W = bhCanvasLocal.width = window.innerWidth * qualityMultiplier;
  H = bhCanvasLocal.height = window.innerHeight * qualityMultiplier;
  if (qualityMultiplier < 1) {
    bhCanvasLocal.style.width = window.innerWidth + 'px';
    bhCanvasLocal.style.height = window.innerHeight + 'px';
  }
}
resizeBH();
window.addEventListener('resize', resizeBH);

function drawBlackHole() {
  t += 0.004;
  bc.fillStyle = 'rgba(0,0,0,0.18)';
  bc.fillRect(0, 0, W, H);

  const cx = W * 0.62, cy = H * 0.42;
  const pulse = 1 + audioEnergy * 0.12;

  // ── Outer glow ──
  const outerR = Math.min(W, H) * 0.38 * pulse;
  const glowGrad = bc.createRadialGradient(cx, cy, outerR * 0.55, cx, cy, outerR);
  glowGrad.addColorStop(0, 'rgba(180,100,30,0.0)');
  glowGrad.addColorStop(0.5, `rgba(200,130,40,${0.04 + audioEnergy * 0.06})`);
  glowGrad.addColorStop(0.8, `rgba(255,200,80,${0.02 + audioEnergy * 0.04})`);
  glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
  bc.beginPath();
  bc.ellipse(cx, cy, outerR, outerR * 0.85, -0.3, 0, Math.PI * 2);
  bc.fillStyle = glowGrad;
  bc.fill();

  // ── Accretion disk rings ──
  const diskRings = isMobile ? 10 : 18; // Меньше колец на мобильных
  for (let i = diskRings; i >= 1; i--) {
    const frac = i / diskRings;
    const rx = outerR * (0.35 + frac * 0.65);
    const ry = rx * (0.12 + frac * 0.08);
    const angle = -0.25 + Math.sin(t * 0.3 + frac) * 0.02;

    const bright = frac < 0.4 ? frac / 0.4 : (1 - frac) / 0.6;
    const energy = 1 + audioEnergy * (1 - frac) * 0.4;

    // warm side (near)
    const warmH = 20 + frac * 25;
    const warmS = 70 + bright * 20;
    const warmL = 30 + bright * 40;
    const warmA = (0.12 + bright * 0.55) * energy;

    bc.save();
    bc.translate(cx, cy);
    bc.rotate(angle + t * (0.015 * (1 - frac * 0.7)));
    bc.beginPath();
    bc.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    const diskGrad = bc.createLinearGradient(-rx, 0, rx, 0);
    diskGrad.addColorStop(0, `hsla(${warmH},${warmS}%,${warmL}%,${warmA * 0.3})`);
    diskGrad.addColorStop(0.3, `hsla(${warmH + 10},${warmS}%,${warmL + 15}%,${warmA})`);
    diskGrad.addColorStop(0.5, `hsla(30,90%,85%,${warmA * 1.2})`);
    diskGrad.addColorStop(0.7, `hsla(${warmH},${warmS}%,${warmL}%,${warmA * 0.8})`);
    diskGrad.addColorStop(1, `hsla(${warmH - 5},${warmS - 10}%,${warmL - 10}%,${warmA * 0.2})`);
    bc.strokeStyle = diskGrad;
    bc.lineWidth = ry * 0.6 + audioEnergy * 2;
    bc.stroke();
    bc.restore();
  }

  // ── Lensing halo (bright arc top) ──
  const haloR = outerR * 0.55 * pulse;
  for (let arc = 0; arc < 3; arc++) {
    const aR = haloR * (1 + arc * 0.04);
    bc.save();
    bc.translate(cx, cy);
    bc.rotate(-0.3 + arc * 0.04);
    bc.beginPath();
    bc.ellipse(0, 0, aR, aR * 0.28, 0, Math.PI * 1.1, Math.PI * 2.0);
    const haloA = (0.6 - arc * 0.18) * (1 + audioEnergy * 0.3);
    bc.strokeStyle = `rgba(255,235,200,${haloA})`;
    bc.lineWidth = 2 - arc * 0.5;
    bc.stroke();
    bc.restore();
  }

  // ── Event horizon (black circle) ──
  const bhR = outerR * 0.32 * pulse;
  const bhGrad = bc.createRadialGradient(cx - bhR * 0.15, cy - bhR * 0.1, 0, cx, cy, bhR * 1.1);
  bhGrad.addColorStop(0, '#000');
  bhGrad.addColorStop(0.7, '#000');
  bhGrad.addColorStop(0.88, 'rgba(0,0,0,0.95)');
  bhGrad.addColorStop(1, 'rgba(0,0,0,0)');
  bc.beginPath();
  bc.arc(cx, cy, bhR * 1.05, 0, Math.PI * 2);
  bc.fillStyle = bhGrad;
  bc.fill();

  // ── Stars ──
  if (t < 0.1) {
    window._stars = Array.from({length: 180}, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.2, a: Math.random()
    }));
  }
  if (window._stars) {
    window._stars.forEach(s => {
      const twinkle = s.a * (0.4 + 0.6 * Math.sin(t * 1.5 + s.x));
      bc.beginPath();
      bc.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      bc.fillStyle = `rgba(255,255,255,${twinkle})`;
      bc.fill();
    });
  }

  // ── Small companion planet ──
  const pAngle = t * 0.08;
  const pOrbitX = cx - Math.min(W,H) * 0.28;
  const pOrbitY = cy - Math.min(W,H) * 0.14;
  const pX = pOrbitX + Math.cos(pAngle) * 12;
  const pY = pOrbitY + Math.sin(pAngle) * 6;
  const pR = Math.min(W,H) * 0.018;
  const pGrad = bc.createRadialGradient(pX - pR*0.3, pY - pR*0.3, 0, pX, pY, pR);
  pGrad.addColorStop(0, '#aaa');
  pGrad.addColorStop(1, '#333');
  bc.beginPath();
  bc.arc(pX, pY, pR, 0, Math.PI * 2);
  bc.fillStyle = pGrad;
  bc.fill();

  requestAnimationFrame(drawBlackHole);
}
drawBlackHole();
}

if (!startBlackHoleGL()) startBlackHole2D();

const audio = document.getElementById('audio');
const visCanvas = document.getElementById('visCanvas');
const vCtx = visCanvas.getContext('2d');

let audioCtx, analyser, sourceNode, dataArr, bufLen;
let tracks = [], curIdx = -1, isConnected = false;
let shuffle = false, repeat = false, fav = false;
let visMode = 'bars', particles = [], animId;

function setupAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    bufLen = analyser.frequencyBinCount;
    dataArr = new Uint8Array(bufLen);
  }
  if (!isConnected) {
    sourceNode = audioCtx.createMediaElementSource(audio);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
    isConnected = true;
  }
}

// feed energy to black hole
function updateEnergy() {
  if (BH_LIVE_FPS === 0) return;                             // статичная дыра не использует энергию звука
  if (document.hidden || bhSuspended || audio.paused) {
    audioEnergy *= 0.95; audioBass *= 0.95;                  // плавно затухает без чтения FFT
    setTimeout(() => requestAnimationFrame(updateEnergy), 100);
    return;
  }
  if (analyser && dataArr) {
    analyser.getByteFrequencyData(dataArr);
    let sum = 0;
    for (let i = 0; i < bufLen; i++) sum += dataArr[i];
    audioEnergy += ((sum / bufLen / 255) - audioEnergy) * 0.12;
    let bsum = 0; const nb = Math.min(4, bufLen);
    for (let i = 0; i < nb; i++) bsum += dataArr[i];
    audioBass += ((bsum / nb / 255) - audioBass) * 0.2;
  }
  requestAnimationFrame(updateEnergy);
}
updateEnergy();

// ─── File load ───
// ─── Хранилище (IndexedDB): треки сохраняются между запусками ───
const DB_NAME = 'blackhole-player', DB_STORE = 'tracks';
let _dbp = null, _tmpId = 0;
function openDB() {
  if (_dbp) return _dbp;
  _dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE, { keyPath: 'id', autoIncrement: true });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return _dbp;
}
function dbReq(mode, fn) {
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, mode);
    const rq = fn(tx.objectStore(DB_STORE));
    tx.oncomplete = () => res(rq.result);
    tx.onerror = tx.onabort = () => rej(tx.error);
  }));
}
const dbAdd = rec => dbReq('readwrite', st => st.add(rec));
const dbAll = () => dbReq('readonly', st => st.getAll());
const dbDelete = id => dbReq('readwrite', st => st.delete(id));

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

function esc(str) { return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ─── File load ───
document.getElementById('fileInput').addEventListener('change', async e => {
  const files = Array.from(e.target.files);
  e.target.value = '';
  for (const f of files) {
    const name = f.name.replace(/\.[^.]+$/, '');
    let id;
    try { id = await dbAdd({ name, blob: f }); } catch (err) { id = 'tmp' + (++_tmpId); }
    tracks.push({ id, name, url: URL.createObjectURL(f) });
  }
  renderList();
  if (curIdx === -1 && tracks.length) loadTrack(0);
});

// восстановление сохранённых треков при запуске
(async () => {
  try {
    const recs = await dbAll();
    recs.sort((a, b) => a.id - b.id);
    recs.forEach(r => tracks.push({ id: r.id, name: r.name, url: URL.createObjectURL(r.blob) }));
    renderList();
  } catch (err) { /* без хранилища плеер работает как раньше */ }
})();

function removeTrack(i) {
  const t = tracks[i];
  if (!t) return;
  if (!confirm('Удалить «' + t.name + '» из плейлиста?')) return;
  if (i === curIdx) {
    audio.pause();
    audio.removeAttribute('src'); audio.load();
    curIdx = -1;
    setPlay(false);
    document.getElementById('pbName').textContent = '—';
    document.getElementById('pbArtist').textContent = 'Выбери трек';
    document.getElementById('pbThumb').textContent = '🌌';
    document.getElementById('progFill').style.width = '0%';
    document.getElementById('timeCur').textContent = '0:00';
    document.getElementById('timeDur').textContent = '0:00';
  } else if (i < curIdx) {
    curIdx--;
  }
  tracks.splice(i, 1);
  URL.revokeObjectURL(t.url);
  if (typeof t.id === 'number') dbDelete(t.id).catch(() => {});
  renderList();
}

function emoji(name) {
  const list = ['🌌','🪐','⭐','🌠','🔭','☄️','🌙','💫'];
  let h = 0; for (let c of name) h = (h*31+c.charCodeAt(0))&0xff;
  return list[h % list.length];
}

function renderList() {
  const list = document.getElementById('trackList');
  document.getElementById('emptyState').style.display = tracks.length ? 'none' : 'flex';
  list.innerHTML = '';
  tracks.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'track-row' + (i === curIdx ? ' playing' : '');
    row.innerHTML = `
      <div class="tr-num">
        <span class="tr-num-val">${i+1}</span>
        <div class="tr-play-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
      </div>
      <div class="tr-thumb">${emoji(t.name)}</div>
      <div class="tr-info"><div class="tr-name">${esc(t.name)}</div><div class="tr-artist">local file</div></div>
      <div class="tr-album">${esc(t.name)}</div>
      <div class="tr-dur">${t.dur ? fmt(t.dur) : '—'}</div>
      <button class="tr-del" title="Удалить" aria-label="Удалить трек"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
    `;
    row.addEventListener('click', () => loadTrack(i));
    row.querySelector('.tr-del').addEventListener('click', ev => { ev.stopPropagation(); removeTrack(tracks.indexOf(t)); });
    if (!t.dur) {
      const tmp = new Audio(t.url);
      tmp.addEventListener('loadedmetadata', () => {
        t.dur = tmp.duration;
        const el = row.querySelector('.tr-dur');
        if (el) el.textContent = fmt(tmp.duration);
      });
    }
    list.appendChild(row);
  });
}

function loadTrack(i) {
  if (i < 0 || i >= tracks.length) return;
  curIdx = i;
  const t = tracks[i];
  audio.src = t.url;
  audio.volume = parseFloat(document.getElementById('volInput').value);
  document.getElementById('pbName').textContent = t.name;
  document.getElementById('pbArtist').textContent = 'local file';
  document.getElementById('pbThumb').textContent = emoji(t.name);
  audio.play().then(() => {
    setupAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    setPlay(true);
    if (document.getElementById('visModal').classList.contains('open')) { resizeVisCanvas(); startVis(); }
  }).catch(() => {});
  renderList();
}

function togglePlay() {
  if (!tracks.length) return;
  if (audio.paused) { if (audioCtx) audioCtx.resume(); audio.play(); setPlay(true); if (document.getElementById('visModal').classList.contains('open')) startVis(); }
  else { audio.pause(); setPlay(false); }
}

document.getElementById('pbPlay').addEventListener('click', togglePlay);
document.getElementById('btnPlayAll').addEventListener('click', () => {

  document.getElementById('pbIconPlay').style.display = p ? 'none' : 'block';
  document.getElementById('pbIconPause').style.display = p ? 'block' : 'none';

}

function startVis() {
  cancelAnimationFrame(animId);
  if (!analyser) return;
  function loop() {
    if (audio.paused || !document.getElementById('visModal').classList.contains('open')) return;
    animId = requestAnimationFrame(loop);
    analyser.getByteFrequencyData(dataArr);
    const VW = visCanvas.width, VH = visCanvas.height;
    vCtx.clearRect(0,0,VW,VH);
    if (visMode==='bars') vDrawBars(VW,VH);
    else if (visMode==='wave') vDrawWave(VW,VH);
    else if (visMode==='circle') vDrawCircle(VW,VH);
    else if (visMode==='particles') vDrawParticles(VW,VH);
  }
  loop();
}

function vDrawBars(W,H) {
  const n=64, step=Math.floor(bufLen/n), bw=W/n-2;
  for (let i=0;i<n;i++) {
    const v=dataArr[i*step]/255, bh=v*H*0.9;
    vCtx.fillStyle=`hsla(${25+i*1.5},${60+v*30}%,${50+v*20}%,${0.5+v*0.5})`;
    vCtx.beginPath();
    if (vCtx.roundRect) vCtx.roundRect(i*(bw+2),H-bh,bw,bh,[3,3,0,0]);
    else vCtx.rect(i*(bw+2),H-bh,bw,bh);
    vCtx.fill();
  }
}

function vDrawWave(W,H) {
  analyser.getByteTimeDomainData(dataArr);
  const g=vCtx.createLinearGradient(0,0,W,0);
  g.addColorStop(0,'#e8a060'); g.addColorStop(0.5,'#fff8e0'); g.addColorStop(1,'#e8a060');
  vCtx.strokeStyle=g; vCtx.lineWidth=2; vCtx.beginPath();
  for (let i=0;i<bufLen;i++) { const y=(dataArr[i]/128)*(H/2); i===0?vCtx.moveTo(0,y):vCtx.lineTo(i*(W/bufLen),y); }
  vCtx.stroke();
}

function vDrawCircle(W,H) {
  const cx=W/2, cy=H/2, r=Math.min(W,H)*0.28, n=120, step=Math.floor(bufLen/n);
  for (let i=0;i<n;i++) {
    const v=dataArr[i*step]/255, a=(i/n)*Math.PI*2-Math.PI/2, len=r*0.6*v;
    vCtx.strokeStyle=`hsla(${20+i*2.5},80%,${55+v*25}%,${0.4+v*0.6})`;
    vCtx.lineWidth=2; vCtx.beginPath();
    vCtx.moveTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r);
    vCtx.lineTo(cx+Math.cos(a)*(r+len), cy+Math.sin(a)*(r+len));
    vCtx.stroke();
  }
  vCtx.beginPath(); vCtx.arc(cx,cy,r,0,Math.PI*2);
  vCtx.strokeStyle='rgba(232,160,96,0.2)'; vCtx.lineWidth=1; vCtx.stroke();
}

function initParticles() { particles=Array.from({length:80},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.003,vy:(Math.random()-.5)*.003,hue:10+Math.random()*50})); }
initParticles();

function vDrawParticles(W,H) {
  let avg=0; for (let i=0;i<bufLen;i++) avg+=dataArr[i]; avg=avg/bufLen/255;
  particles.forEach(p=>{
    p.x+=p.vx*(1+avg*6); p.y+=p.vy*(1+avg*6);
    if(p.x<0)p.x=1; if(p.x>1)p.x=0; if(p.y<0)p.y=1; if(p.y>1)p.y=0;
    vCtx.beginPath(); vCtx.arc(p.x*W,p.y*H,2+avg*8,0,Math.PI*2);
    vCtx.fillStyle=`hsla(${p.hue+avg*30},80%,65%,${0.35+avg*0.6})`;
    vCtx.fill();
  });
}

window.addEventListener('resize', () => { if (document.getElementById('visModal').classList.contains('open')) resizeVisCanvas(); });

// ═══ PWA: Service Worker ═══
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// ═══ MOBILE: предотвращаем зум при двойном тапе ═══
let lastTap = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTap < 300) e.preventDefault();
  lastTap = now;
}, { passive: false });
</script>
</body>
